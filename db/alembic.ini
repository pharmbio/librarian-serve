# For `alembic ...` commands run from db/, e.g.
#   uv run alembic revision --autogenerate -m "add a column"
# The service runs `upgrade head` by itself at startup (db_service/main.py).
# The database URL comes from DATABASE_URL (db_service/config.py), not here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
