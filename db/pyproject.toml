[project]
name = "librarian-db"
version = "1.0.0"
description = "The db service: owns all persistence and serves it as a REST API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",    # the REST API and its OpenAPI docs
    "uvicorn==0.54.0",     # ASGI server
    "sqlalchemy==2.1.1",   # models and queries
    "alembic==1.20.0",     # schema migrations, run at startup
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",      # FastAPI's TestClient
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
