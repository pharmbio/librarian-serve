; Runs the 11 services of Supabase's docker-compose.yml in this one container,
; and restarts any that stops. Each service's script is in services/.
;
; Lower priority starts first and stops last: Postgres before everything that
; needs it, the gateway after everything it routes to. Services that need the
; database wait for it themselves (wait_for_db in services/lib.sh).
;
;   supervisorctl -c ~/supervisord.conf status    ; see every service

[supervisord]
nodaemon=true
; In the foreground, supervisord already logs to stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:db]
command=/home/supabase/services/db.sh
priority=10
; SIGINT is Postgres's fast shutdown: it doesn't wait for clients to leave.
stopsignal=INT
stopwaitsecs=60
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Not a service: brings the schema of Librarian's app up to date, then exits.
; A failed migration stays failed (healthcheck.sh reports it) until fixed:
; supervisorctl -c ~/supervisord.conf start schema
[program:schema]
command=/home/supabase/services/schema.sh
priority=15
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth]
command=/home/supabase/services/auth.sh
priority=20
stopasgroup=true
autorestart=true
startsecs=5
startretries=20
